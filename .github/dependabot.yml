# 依存の更新を週に1回、種類ごとに1つの PR にまとめて受け取る。
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      # / は pnpm の workspace (npm、site、assets) で、拡張だけ別
      - /
      - /editors/vscode
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
