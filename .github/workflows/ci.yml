name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # 非同期は goroutine の間で順番を受け渡すので、データ競合がないか -race で確かめる
      - run: go test -race ./...
        env:
          FXMA_DICT_CHECK: "1"
      # サンプルを fxma 自身で検査し、テストする
      - run: go run ./cmd/fxma lavi examples
      - run: go run ./cmd/fxma coatain examples
