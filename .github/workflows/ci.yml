name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # 呼んでいるコードに既知の脆弱性があれば落とす。Go 本体のものは go.mod の go の版を上げて直す
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # 非同期は goroutine の間で順番を受け渡すので、データ競合がないか -race で確かめる
      - run: go test -race ./...
        env:
          FXMA_DICT_CHECK: "1"
      # サンプルを fixmarge 自身で検査し、テストする
      - run: go run ./cmd/fixmarge lavi examples
      - run: go run ./cmd/fixmarge coatain examples
      - run: shellcheck installer/public/install.sh scripts/*.sh
      # リリースのときに初めて設定の誤りに気付かないように
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  # WebAssembly 版を作り、npm のパッケージをテストし、プレイグラウンドがビルドできるか確かめる
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: GOOS=js GOARCH=wasm go vet ./cmd/fixmarge-wasm/
      - run: pnpm test:wasm
      # Cloudflare に送る形まで作り、送らずに確かめる
      - run: pnpm build:playground
      - run: pnpm --filter fixmarge-playground exec cf deploy --prebuilt --mode production --dry-run

  # Windows のセットアップを作り、黙って入れて消し、PATH が足されて戻るか確かめる
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build fixmarge.exe
        shell: bash
        run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/windows/$arch/fixmarge.exe ./cmd/fixmarge
          done
          sh scripts/third-party-licenses.sh
      - name: Build setup
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.0-ci installer\fixmarge.iss'
      - name: Install and uninstall
        run: |
          $app = "$env:LOCALAPPDATA\Programs\fixmarge"
          function UserPath { [Environment]::GetEnvironmentVariable("Path", "User") }
          Start-Process dist\fixmarge_0.0.0-ci_windows_setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER" -Wait
          & "$app\fixmarge.exe" neyar
          if ($LASTEXITCODE -ne 0) { throw "fixmarge neyar failed" }
          if ((UserPath) -split ";" -notcontains $app) { throw "PATH does not contain $app" }
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          Start-Sleep -Seconds 3
          if ((UserPath) -split ";" -contains $app) { throw "PATH still contains $app" }
          if (Test-Path "$app\fixmarge.exe") { throw "fixmarge.exe was not removed" }
      # ファイル バージョンの4つ目が、プレリリースの段階と番号の決まり (installer/fixmarge.iss) どおりかを確かめる
      - name: Check file versions
        run: |
          $want = [ordered]@{ "0.0.0-ci" = "0.0.0.0"; "1.2.3-alpha.0" = "1.2.3.1000"; "1.2.3-beta.12" = "1.2.3.2012"; "1.2.3-rc.4" = "1.2.3.3004"; "1.2.3" = "1.2.3.65535" }
          foreach ($v in $want.Keys) {
            if ($v -ne "0.0.0-ci") {
              & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$v" installer\fixmarge.iss
              if ($LASTEXITCODE -ne 0) { throw "ISCC failed for $v" }
            }
            $info = (Get-Item "dist\fixmarge_${v}_windows_setup.exe").VersionInfo
            $file = "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart).$($info.FilePrivatePart)"
            if ($file -ne $want[$v]) { throw "${v}: file version $file, want $($want[$v])" }
            if ($info.ProductVersion -ne $v) { throw "${v}: product version $($info.ProductVersion), want $v" }
          }

  # VS Code 拡張を VSIX にまとめられるか確かめる (文法が語の表と合っているかは go test が見る)
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 拡張だけは pnpm の workspace に入れていない (pnpm-workspace.yaml)
      - run: npm ci --prefix editors/vscode
      - run: npx vsce package --out fixmarge.vsix
        working-directory: editors/vscode
