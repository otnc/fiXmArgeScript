name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # 呼んでいるコードに既知の脆弱性があれば落とす。Go 本体のものは go.mod の go の版を上げて直す
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # 非同期は goroutine の間で順番を受け渡すので、データ競合がないか -race で確かめる
      - run: go test -race ./...
        env:
          FXMA_DICT_CHECK: "1"
      # サンプルを fixmarge 自身で検査し、テストする
      - run: go run ./cmd/fixmarge lavi examples
      - run: go run ./cmd/fixmarge coatain examples
      - run: shellcheck installer/public/install.sh scripts/*/*.sh
      # リリースのときに初めて設定の誤りに気付かないように
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  # WebAssembly 版を作り、npm のパッケージをテストし、プレイグラウンドがビルドできるか確かめる
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: GOOS=js GOARCH=wasm go vet ./cmd/fixmarge-wasm/
      - run: pnpm test:wasm
      # Cloudflare に送る形まで作り、送らずに確かめる
      - run: pnpm build:playground
      - run: pnpm --filter fixmarge-playground exec cf deploy --prebuilt --mode production --dry-run

  # Windows のセットアップを作り、黙って入れて消し、PATH が足されて戻るか確かめる
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build fixmarge.exe
        shell: bash
        run: sh scripts/build/windows.sh
      - name: Build setup
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.0-ci installer\fixmarge.iss'
      - name: Install and uninstall
        run: ./scripts/check/installer.ps1
      - name: Check file versions
        run: ./scripts/check/installer-versions.ps1

  # VS Code 拡張を VSIX にまとめられるか確かめる (文法が語の表と合っているかは go test が見る)
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 拡張だけは pnpm の workspace に入れていない (pnpm-workspace.yaml)
      - run: npm ci --prefix editors/vscode
      - run: npx vsce package --out fixmarge.vsix
        working-directory: editors/vscode
