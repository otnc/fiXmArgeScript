name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # 非同期は goroutine の間で順番を受け渡すので、データ競合がないか -race で確かめる
      - run: go test -race ./...
        env:
          FXMA_DICT_CHECK: "1"
      # サンプルを fxma 自身で検査し、テストする
      - run: go run ./cmd/fxma lavi examples
      - run: go run ./cmd/fxma coatain examples
      - run: shellcheck installer/public/install.sh scripts/*.sh
      # リリースのときに初めて設定の誤りに気付かないように
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  # WebAssembly 版を作り、npm のパッケージをテストし、プレイグラウンドがビルドできるか確かめる
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: GOOS=js GOARCH=wasm go vet ./cmd/fxma-wasm/
      - run: node npm/build.mjs
      - run: node --test npm/test/fxma.test.js
      - run: npm ci --prefix playground
      # Cloudflare に送る形まで作り、送らずに確かめる
      - run: npx cf build
        working-directory: playground
      - run: npx cf deploy --prebuilt --mode production --dry-run
        working-directory: playground

  # Windows のセットアップを作り、黙って入れて消し、PATH が足されて戻るか確かめる
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build fxma.exe
        shell: bash
        run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/windows/$arch/fxma.exe ./cmd/fxma
          done
          sh scripts/third-party-licenses.sh
      - name: Build setup
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.0-ci installer\fxma.iss'
      - name: Install and uninstall
        run: |
          $app = "$env:LOCALAPPDATA\Programs\fxma"
          function UserPath { [Environment]::GetEnvironmentVariable("Path", "User") }
          Start-Process dist\fxma_0.0.0-ci_windows_setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER" -Wait
          & "$app\fxma.exe" neyar
          if ($LASTEXITCODE -ne 0) { throw "fxma neyar failed" }
          if ((UserPath) -split ";" -notcontains $app) { throw "PATH does not contain $app" }
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          Start-Sleep -Seconds 3
          if ((UserPath) -split ";" -contains $app) { throw "PATH still contains $app" }
          if (Test-Path "$app\fxma.exe") { throw "fxma.exe was not removed" }

  # VS Code 拡張を VSIX にまとめられるか確かめる (文法が語の表と合っているかは go test が見る)
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --prefix editors/vscode
      - run: npx vsce package --out fxma.vsix
        working-directory: editors/vscode
