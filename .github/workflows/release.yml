name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "次の版：patch・minor・major・prerelease のどれか、または版そのもの (0.2.0、0.2.0-rc.0)"
        required: true
        default: patch
      preid:
        description: "プレリリースの識別子 (rc・beta など)。patch・minor・major と一緒なら 0.2.0-rc.0 のようにプレリリースにする"
        required: false
        default: ""

permissions:
  contents: write # タグを打ち、Releases を作る

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          FXMA_DICT_CHECK: "1"
      - run: node npm/build.mjs
      - run: node --test npm/test/fxma.test.js

      - name: Decide version
        id: next
        env:
          VERSION: ${{ inputs.version }}
          PREID: ${{ inputs.preid }}
        run: sh scripts/next-version.sh >> "$GITHUB_OUTPUT"

      - name: Tag
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Inno Setup は Windows でしか動かないので、Releases の Windows 向けの zip からセットアップを作って足す
  installer:
    needs: release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Build setup
        run: |
          $version = $env:TAG.Substring(1)
          foreach ($arch in "amd64", "arm64") {
            gh release download $env:TAG -p "fxma_${version}_windows_${arch}.zip" -D dist
            Expand-Archive "dist\fxma_${version}_windows_${arch}.zip" "dist\windows\$arch"
          }
          Copy-Item dist\windows\amd64\THIRD_PARTY_LICENSES .
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\fxma.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Upload
        run: |
          $setup = "fxma_$($env:TAG.Substring(1))_windows_setup.exe"
          gh release download $env:TAG -p checksums.txt -D dist --clobber
          $hash = (Get-FileHash "dist\$setup" -Algorithm SHA256).Hash.ToLower()
          # GoReleaser と同じ形 (ハッシュ、空白2つ、名前) で、改行は LF
          [IO.File]::AppendAllText("dist\checksums.txt", "$hash  $setup`n")
          gh release upload $env:TAG "dist\$setup" dist\checksums.txt --clobber
