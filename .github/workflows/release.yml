name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "次の版：patch・minor・major・prerelease のどれか、または版そのもの (0.2.0、0.2.0-rc.0)"
        required: true
        default: patch
      preid:
        description: "プレリリースの識別子 (rc・beta など)。patch・minor・major と一緒なら 0.2.0-rc.0 のようにプレリリースにする"
        required: false
        default: ""

permissions:
  contents: write # タグを打ち、Releases を作る

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          FXMA_DICT_CHECK: "1"
      - run: node npm/build.mjs
      - run: node --test npm/test/fixmarge.test.js

      - name: Decide version
        id: next
        env:
          VERSION: ${{ inputs.version }}
          PREID: ${{ inputs.preid }}
        run: sh scripts/next-version.sh >> "$GITHUB_OUTPUT"

      - name: Tag
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # npm の Trusted Publishing で公開する。トークンを置かずに済み、provenance も付く
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node npm/build.mjs
      - name: Publish
        working-directory: npm
        run: |
          version=${TAG#v}
          # dist-tag はプレリリースなら識別子 (0.2.0-rc.1 なら rc)、正式版なら latest
          case "$version" in
            *-*)
              dist_tag=${version#*-}
              dist_tag=${dist_tag%%.*}
              ;;
            *) dist_tag=latest ;;
          esac
          # package.json の version は 0.0.0 のままにし、リリースのときだけ書き換える (コミットはしない)
          npm pkg set version="$version"
          npm publish --tag "$dist_tag"

  # Inno Setup は Windows でしか動かないので、Releases の Windows 向けの zip からセットアップを作って足す
  installer:
    needs: release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Build setup
        run: |
          $version = $env:TAG.Substring(1)
          foreach ($arch in "amd64", "arm64") {
            gh release download $env:TAG -p "fixmarge_${version}_windows_${arch}.zip" -D dist
            Expand-Archive "dist\fixmarge_${version}_windows_${arch}.zip" "dist\windows\$arch"
          }
          Copy-Item dist\windows\amd64\THIRD_PARTY_LICENSES .
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\fixmarge.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Upload
        run: |
          $setup = "fixmarge_$($env:TAG.Substring(1))_windows_setup.exe"
          gh release download $env:TAG -p checksums.txt -D dist --clobber
          $hash = (Get-FileHash "dist\$setup" -Algorithm SHA256).Hash.ToLower()
          # GoReleaser と同じ形 (ハッシュ、空白2つ、名前) で、改行は LF
          [IO.File]::AppendAllText("dist\checksums.txt", "$hash  $setup`n")
          gh release upload $env:TAG "dist\$setup" dist\checksums.txt --clobber

  # VS Code 拡張の VSIX を Releases に足す。checksums.txt を書き換えるので、installer の後に動かす
  vscode:
    needs: [release, installer]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --prefix editors/vscode
      - name: Package and upload
        working-directory: editors/vscode
        run: |
          version=${TAG#v}
          vsix="fixmarge_${version}_vscode.vsix"
          # package.json の version は 0.0.0 のままにし、リリースのときだけ書き換える (コミットはしない)
          npm pkg set version="$version"
          npx vsce package --out "$vsix"
          gh release download "$TAG" -p checksums.txt --clobber
          sha256sum "$vsix" >> checksums.txt
          gh release upload "$TAG" "$vsix" checksums.txt --clobber
      # Marketplace は 0.2.0-rc.1 のようなプレリリースの版を受け付けないので、正式版だけ出す
      - name: Publish to Marketplace
        if: ${{ !contains(needs.release.outputs.tag, '-') }}
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "fixmarge_${TAG#v}_vscode.vsix"
