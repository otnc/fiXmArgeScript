name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "次の版：patch・minor・major・prerelease のどれか、または版そのもの (0.2.0、0.2.0-rc.0)"
        required: true
        default: patch
      preid:
        description: "プレリリースの識別子 (alpha・beta・rc のどれか)。patch・minor・major と一緒なら 0.2.0-rc.0 のようにプレリリースにする"
        required: false
        default: ""

permissions:
  contents: write # タグを打ち、Releases を作る

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          FXMA_DICT_CHECK: "1"
      - run: node npm/build.mjs
      - run: node --test npm/test/fixmarge.test.js

      - name: Decide version
        id: next
        env:
          VERSION: ${{ inputs.version }}
          PREID: ${{ inputs.preid }}
        run: sh scripts/release/next-version.sh >> "$GITHUB_OUTPUT"

      - name: Tag
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # npm の Trusted Publishing で公開する。トークンを置かずに済み、provenance も付く
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node npm/build.mjs
      - run: sh scripts/release/npm.sh

  # Inno Setup は Windows でしか動かないので、Releases の Windows 向けの zip からセットアップを作って足す
  installer:
    needs: release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - run: ./scripts/release/installer.ps1

  # VS Code 拡張の VSIX を Releases に足す。checksums.txt を書き換えるので、installer の後に動かす
  vscode:
    needs: [release, installer]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix editors/vscode
      - run: sh scripts/release/vscode.sh
      # Marketplace は 0.2.0-rc.1 のようなプレリリースの版を受け付けないので、正式版だけ出す
      - name: Publish to Marketplace
        if: ${{ !contains(needs.release.outputs.tag, '-') }}
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "fixmarge_${TAG#v}_vscode.vsix"
      # VSCodium や Cursor などは Marketplace を使えないので、Open VSX にも同じ VSIX を出す
      - name: Publish to Open VSX
        if: ${{ !contains(needs.release.outputs.tag, '-') }}
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx@1.4.0 --pat "$OVSX_PAT" publish "fixmarge_${TAG#v}_vscode.vsix"
