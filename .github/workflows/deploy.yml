name: deploy

# サイト (紹介・ドキュメント・プレイグラウンド) と install.sh を Cloudflare Workers (https://fixmargescript.oto.im/) に置く。
# 出すものが変わる push のときだけ動かす (spec/ はドキュメントに写すので含める。README だけの変更では出し直さない)。手でも動かせる
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/**
      - spec/**
      - packaging/assets/**
      - editors/vscode/syntaxes/**
      - packaging/npm/**
      - packaging/installer/public/**
      - examples/**
      - cmd/fixmarge-wasm/**
      - internal/**
      - go.mod
      - go.sum
      - pnpm-lock.yaml
      - .github/workflows/deploy.yml

permissions:
  contents: read

concurrency:
  group: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:site
      - run: pnpm --filter fixmarge-site exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
