name: deploy

# プレイグラウンドと install.sh を Cloudflare Workers (https://fixmargescript.oto.im/) に置く。
# 出すものが変わる push のときだけ動かす (docs だけの変更では出し直さない)。手でも動かせる
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - playground/**
      - npm/**
      - installer/public/**
      - examples/**
      - cmd/fixmarge-wasm/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/deploy.yml

permissions:
  contents: read

concurrency:
  group: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node npm/build.mjs
      - run: npm ci --prefix playground
      - run: npx cf build
        working-directory: playground
      - run: npx cf deploy --prebuilt --mode production
        working-directory: playground
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
