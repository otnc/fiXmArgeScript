# JavaScript のパッケージをまとめる。開発のコマンドはルートの package.json の scripts に並べてある。
# editors/vscode は入れない。vsce (VSIX を作る道具) が pnpm の node_modules を読めないのと、
# 拡張の名前が npm/ のパッケージと同じ fixmarge でぶつかるため。そこだけ npm を使う。
packages:
  - npm
  - playground
  - assets

# インストールのときにスクリプトを動かしてよい依存。workerd はプレイグラウンドのビルド (cf build) が使う Cloudflare の実行環境
allowBuilds:
  workerd: true

# scripts の FXMA_UPDATE=1 go test ... のような書き方を、Windows でもそのまま動かす
shellEmulator: true
