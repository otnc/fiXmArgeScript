# 版はタグから決まる (spec/distribution.md の「版とリリース」)。タグを打つのは release.yml。
version: 2

before:
  hooks:
    # packaging/npm/ に wasm_exec.js を写すため。fixmarge.wasm もできるが、ここでは使わない
    - node packaging/npm/build.mjs
    - sh scripts/build/third-party-licenses.sh

builds:
  - id: fixmarge
    main: ./cmd/fixmarge
    binary: fixmarge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # fixmarge neyar は Go が埋め込む版を読むので、-X で版を渡さない
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: wasm
    main: ./cmd/fixmarge-wasm
    binary: fixmarge
    env:
      - CGO_ENABLED=0
    goos: [js]
    goarch: [wasm]
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: fixmarge
    ids: [fixmarge]
    name_template: "fixmarge_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE-MIT
      - LICENSE-APACHE
      - THIRD_PARTY_LICENSES

  - id: wasm
    ids: [wasm]
    name_template: "fixmarge_{{ .Version }}_wasm"
    formats: [zip]
    files:
      - README.md
      - LICENSE-MIT
      - LICENSE-APACHE
      - THIRD_PARTY_LICENSES
      - src: packaging/npm/wasm_exec.js
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github-native

release:
  prerelease: auto
  # リリースのやり直し (release.yml に最新の版をそのまま書いて動かす) で、上げ済みのファイルを置き換える
  replace_existing_artifacts: true
